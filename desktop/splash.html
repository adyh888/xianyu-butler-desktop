<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>闲鱼管家</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: linear-gradient(160deg, #0f172a 0%, #1e293b 60%, #0e7490 130%);
    color: #e2e8f0;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  .logo {
    width: 64px; height: 64px;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    background: linear-gradient(145deg, #06b6d4, #3b82f6);
    box-shadow: 0 8px 24px rgba(6, 182, 212, .35);
  }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: 2px; }
  .spinner {
    width: 22px; height: 22px;
    border: 3px solid rgba(148, 163, 184, .25);
    border-top-color: #22d3ee;
    border-radius: 50%;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 13px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="logo">🐟</div>
  <h1>闲鱼管家</h1>
  <div class="spinner"></div>
  <p>正在启动本地服务，首次启动需要初始化，请稍候…</p>
</body>
</html>
